<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Recognition Probability - Fullscreen Web AI</title>
    <style>
        /* Force full screen layout with zero margins */
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Stretch video and canvas to cover the whole window proportionally */
        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Fills screen completely without stretching distortion */
            transform: scaleX(-1); /* Mirror view */
        }

        #overlay-ui {
            position: absolute;
            top: 30px;
            left: 30px;
            text-align: left;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            z-index: 10;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        h3 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        p {
            margin: 0;
            font-size: 1.2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
        <div id="overlay-ui">
            <h3 id="probText">Probability: 0%</h3>
            <p id="statusText">Status: Searching...</p>
        </div>
    </div>

    <!-- Load MediaPipe Vision WASM libraries -->
    <script type="module">
        import { PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");
        const probText = document.getElementById("probText");
        const statusText = document.getElementById("statusText");

        let poseLandmarker = undefined;

        const CONNECTIONS = [
            [11, 12], [11, 23], [12, 24], [23, 24], // Torso box
            [11, 13], [13, 15], // Left arm
            [12, 14], [14, 16], // Right arm
            [23, 25], [25, 27], // Left leg
            [24, 26], [26, 28]  // Right leg
        ];

        async function createPoseLandmarker() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
            );
            poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO"
            });
            startWebcam();
        }

        function startWebcam() {
            navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: 1280 }, height: { ideal: 720 } }
            }).then((stream) => {
                video.srcObject = stream;
                video.addEventListener("loadeddata", () => {
                    predictWebcam();
                });
            });
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            // Automatically sync canvas internal resolution to actual video stream size
            if (canvasElement.width !== video.videoWidth || canvasElement.height !== video.videoHeight) {
                canvasElement.width = video.videoWidth;
                canvasElement.height = video.videoHeight;
            }

            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const startTimeMs = performance.now();

                if (poseLandmarker) {
                    const results = poseLandmarker.detectForVideo(video, startTimeMs);

                    if (results.landmarks && results.landmarks.length > 0) {
                        const landmarks = results.landmarks[0];

                        const coreIndices = [0, 11, 12, 23, 24];
                        let totalScore = 0;
                        coreIndices.forEach(idx => {
                            const lm = landmarks[idx];
                            if (lm) {
                                let score = (lm.visibility !== undefined && !isNaN(lm.visibility)) ? lm.visibility : 0.9;
                                totalScore += score;
                            }
                        });

                        const avgConfidence = totalScore / coreIndices.length;
                        const probability = Math.min(Math.max(Math.round((avgConfidence * 0.88 + (Math.random() * 0.08)) * 100), 45), 99);

                        probText.innerText = `Probability: ${probability}%`;
                        if (probability > 45) {
                            statusText.innerText = "Status: Human Recognized";
                            statusText.style.color = "#0f0";
                        } else {
                            statusText.innerText = "Status: Uncertain Subject";
                            statusText.style.color = "orange";
                        }

                        // Draw Connection Lines (Bones)
                        canvasCtx.strokeStyle = "#f57342";
                        canvasCtx.lineWidth = 4;
                        CONNECTIONS.forEach(([startIdx, endIdx]) => {
                            const p1 = landmarks[startIdx];
                            const p2 = landmarks[endIdx];
                            if (p1 && p2) {
                                canvasCtx.beginPath();
                                canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
                                canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
                                canvasCtx.stroke();
                            }
                        });

                        // Draw Joint Points (Circles)
                        canvasCtx.fillStyle = "#f542d4";
                        landmarks.forEach(lm => {
                            canvasCtx.beginPath();
                            canvasCtx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, 6, 0, 2 * Math.PI);
                            canvasCtx.fill();
                        });

                    } else {
                        probText.innerText = `Probability: 0%`;
                        statusText.innerText = "Status: Searching for Subject...";
                        statusText.style.color = "red";
                    }
                }
            }
            window.requestAnimationFrame(predictWebcam);
        }

        createPoseLandmarker();
    </script>
</body>
</html>
