<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebXR AR Passthrough Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; }
    </style>
</head>
<body>

    <!-- Import Map für Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let container;
        let camera, scene, renderer;
        let controller;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let modelLoaded = false;
        let placedModel = null;

        init();
        animate();

        function init() {
            container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // Transparenter Hintergrund für Passthrough (wichtig!)
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true; // WebXR aktivieren
            container.appendChild(renderer.domElement);

            // Lichtquellen hinzufügen
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            // AR-Button einfügen, der die Kamera-/Passthrough-Ansicht startet
            document.body.appendChild(ARButton.createButton(renderer, { 
                requiredFeatures: ['hit-test'] // Ermöglicht das Anvisieren von Böden/Wänden
            }));

            // Controller für Touch / Klick im AR-Modus
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // Ziel-Ring (Reticle), der anzeigt, wo das Objekt platziert werden kann
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // 3D-Modell laden (wird im Speicher gehalten und bei Klick im Raum platziert)
            const loader = new GLTFLoader();
            loader.load('models/Untitled_2.glb', (gltf) => {
                placedModel = gltf.scene;
                placedModel.scale.set(0.5, 0.5, 0.5); // Größe anpassen falls nötig
                modelLoaded = true;
            });

            window.addEventListener('resize', onWindowResize);
        }

        // Wird ausgeführt, wenn der Nutzer auf den Bildschirm tippt (im AR-Modus)
        function onSelect() {
            if (reticle.visible && modelLoaded && placedModel) {
                // Klonen und an die Position des Ziel-Rings setzen
                const clone = placedModel.clone();
                reticle.matrix.decompose(clone.position, clone.quaternion, clone.scale);
                scene.add(clone);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then((space) => {
                        session.requestHitTestSource({ space: space }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
