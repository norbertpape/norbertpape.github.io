<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Collection</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8f9fa;
            padding: 2rem;
            margin: 0;
        }

        /* Fixed 2-column layout */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Exactly 2 videos per row */
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Collapse to 1 column on small mobile screens for readability */
        @media (max-width: 600px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
        }

        .video-card {
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
        }

        .responsive-iframe {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            background-color: #000;
        }

            .responsive-iframe iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                border: 0;
            }

        .video-info {
            padding: 1rem 1.25rem;
        }

        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a1a1a;
            margin: 0 0 0.25rem 0;
        }

        .video-platform {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="section-title">Selected Videos</h1>
        <div class="video-grid">

            <!-- Row 1, Video 1 -->
            <div class="video-card">
                <div class="responsive-iframe">
                    <iframe src="https://drive.google.com/file/d/1lOBKnemSCW8EU2IGRDUyCh-DtqC118I7/preview"
                            allow="autoplay"
                            allowfullscreen>
                    </iframe>
                </div>
                <div class="video-info">
                    <h3 class="video-title">Turbulence (text by Ben Woodard)</h3>
                    <span class="video-platform">Google Drive</span>
                </div>
            </div>

            <!-- Row 1, Video 2 -->
            <div class="video-card">
                <div class="responsive-iframe">
                    <iframe src="https://drive.google.com/file/d/1Sr24KcfkV5GhHZg4mRlM7ho5QX7eQJcU/preview"
                            allow="autoplay"
                            allowfullscreen>
                    </iframe>
                </div>
                <div class="video-info">
                    <h3 class="video-title">Turbulence - Headset POV</h3>
                    <span class="video-platform">Google Drive</span>
                </div>
            </div>


            <!-- Row 2, Video 3 -->
            <div class="video-card">
                <div class="responsive-iframe">
                    <iframe src="https://www.youtube.com/embed/933XWN90OfQ"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen>
                    </iframe>
                </div>
                <div class="video-info">
                    <h3 class="video-title">Dream Stones  (text by Ben Woodard)</h3>
                    <span class="video-platform">YouTube</span>
                </div>
            </div>

            <!-- Row 2, Video 4 -->
            <div class="video-card">
                <div class="responsive-iframe">
                    <iframe src="https://player.vimeo.com/video/1191113012"
                            allow="autoplay; fullscreen; picture-in-picture"
                            allowfullscreen>
                    </iframe>
                </div>
                <div class="video-info">
                    <h3 class="video-title">Touching Clouds</h3>
                    <span class="video-platform">Vimeo</span>
                </div>
            </div>

            <!-- Row 3, Video 5 -->
            <div class="video-card">
                <div class="responsive-iframe">
                    <iframe src="https://www.youtube.com/embed/eAFcvh6Mfh8"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen>
                    </iframe>
                </div>
                <div class="video-info">
                    <h3 class="video-title">Le Bruit et l'Odeur</h3>
                    <span class="video-platform">YouTube</span>
                </div>
            </div>

        </div>
        </div>

</body>
</html>
