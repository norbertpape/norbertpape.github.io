<!doctype html>
<html>
<head>
    <!-- 1. TimelineJS CSS -->
    <link rel="stylesheet" href="timeline.css">

    <!-- 2. Your custom CSS overrides -->
    <style>
        body {
            background-color: #000000;
            color: #ffffff; /* Sets default text color to white for readability */
            margin: 0; /* Removes default browser page margins */
        }
        /* Ensure the container has height */
        #timeline-embed {
            width: 100%;
            height: 900px;
        }
    </style>
</head>
<body>

    <!-- 3. Timeline container -->
    <div id='timeline-embed'></div>

    <!-- 4. TimelineJS JS library -->
    <script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>

    <!-- 5. Instantiate TimelineJS -->
    <script type="text/javascript">
      // Options match your original URL parameters
      var options = {
        font: 'Default',
        lang: 'en',
          initial_zoom: 0,
          scale_factor: 0.6,
          marker_height_max : 10,
          timenav_stack: true,// 3. Set minimum marker height and padding so stacked flags fit neatly
          timenav_height_percentage: 70
      };

      // Source URL decoded from your original iframe src
      var source = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRACtuCI4jSYuw3v-gZmu1x2r1ObMaxcxP0GOY8JfxKvCTeNSuuU5naukecmRTDoOCvt4iC2it2i1Z3/pubhtml';

      window.timeline = new TL.Timeline('timeline-embed', source, options);
    </script>
</body>
</html>
