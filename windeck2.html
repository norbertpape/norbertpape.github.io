<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Vimeo Video with Play Button</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

            .video-container iframe {
                position: absolute;
                top: 50%;
                left: 50%;
                width: 100vw;
                height: 56.25vw; /* 16:9 aspect ratio */
                min-height: 100vh;
                min-width: 177.77vh; /* 16:9 aspect ratio */
                transform: translate(-50%, -50%);
                border: 0;
                /* pointer-events allowed so you can click the play button and controls */
            }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Parameters used:
         autoplay=0 (does not start automatically)
         muted=0 (sound is enabled)
         controls=1 (shows playback controls and play button) -->
        <iframe src="https://player.vimeo.com/video/1236302132?h=012ec7c71b&autoplay=0&muted=0&controls=1"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen>
        </iframe>
    </div>

</body>
</html>
