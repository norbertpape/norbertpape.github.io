<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GLB Model Cycler with MP3 & HD Snapshot</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #FFF;
            font-family: sans-serif;
        }

        canvas {
            display: block;
        }

        /* Top Text Overlay (Shows for 3s on model load) */
        #model-text-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
            z-index: 50;
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Intro Instruction Overlay */
        #intro-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            z-index: 100;
            transition: opacity 0.8s ease;
            cursor: pointer;
            padding: 20px;
        }

        /* Button Container für die Steuerung unten in der Mitte */
        .button-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        /* Styling für die Buttons (Größer gemacht) */
        .ui-btn {
            padding: 18px 32px;
            background-color: #ffffff;
            color: #111;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background 0.2s, transform 0.1s;
        }

            .ui-btn:hover {
                background-color: #ddd;
            }

            .ui-btn:active {
                transform: scale(0.96);
            }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.6);
            padding: 8px 12px;
            border-radius: 5px;
            pointer-events: none;
            display: none; /* Hidden as requested/replaced by top overlay */
        }

        #audio-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: background 0.2s;
        }

            #audio-overlay:hover {
                background: rgba(40,40,40,0.9);
            }
    </style>
</head>
<body>

    <!-- Intro Instructions Screen (Dismisses on Touch/Click) -->
    <div id="intro-overlay">Drehen und zoomen Sie<br>mit dem Touchscreen<br> oder der Maus</div>

    <!-- Top Text Overlay for Figures -->
    <div id="model-text-overlay">Yoga und Entspannen<br>im Sonnenschein</div>

    <div id="info">Current Model: <span id="model-name">Loading...</span></div>

    <!-- Button Container -->
    <div class="button-container">
        <button class="ui-btn" id="next-btn">Next Model 🔄</button>
    </div>

    <!-- Import Three.js, OrbitControls, und GLTFLoader via CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // 1. Liste deiner .glb-Dateien
        const modelFiles = [
            'models/261014_H5_2rc.glb',
            'models/261014_H4_4.glb',
            'models/261014_H5_1.glb',
            'models/261015_U8x.glb',
            'models/261015_U10xs.glb',
            'models/261015_U13.glb',
            'models/261013_H1_2.glb',
            'models/261013_H1_3.glb',
            'models/261013_H1_5.glb',
            'models/261013_H2_2_edited.glb',
            'models/261013_H3_1.glb',
            'models/261013_H4_2.glb',
            'models/261013_H5_1.glb',
            'models/261013_H5_2.glb',
            'models/261013_HN1_2.glb',
            'models/261014_H2_2.glb',
            'models/261014_H4_1x.glb',
            'models/261013_H2_1.glb',
            'models/261014_H1_1.glb',
            'models/261014_H1_2.glb',
            'models/261014_H3_1.glb',
            'models/261014_H3_2.glb',
            'models/261014_H5_3.glb',
            'models/261014_H6_2.glb'
        ];

        const modelText = [
            'Das wünsche ich Shekiba, in ein paar Jahren.',
            '',
            '',
            'Enter the house',
            '',
            'Buehnenbild für Vibe Tribe',
            '',
            '',
            '',
            '',
            '',
            '',
            '',
            '',
            '',
            'Drei Freundinnen',
            '',
            '',
            'Yoga und Entspannen im Sonnenschein',
            'Mensch auf dem Mond, Erde, Saturn',
            'Leonies große Liebe',
            'Fine beim Frisör',
            '',
            'Das Gemalte von Malou',
        ];
        let currentIndex = 0;
        let currentModel = null;
        let audioStarted = false;
        let textTimeout = null;

        // 2. Scene, Camera, Renderer Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 3. MP3 Audio Setup
        const listener = new THREE.AudioListener();
        camera.add(listener);

        const backgroundSound = new THREE.Audio(listener);
        const audioLoader = new THREE.AudioLoader();

        audioLoader.load('models/sound.mp3', (buffer) => {
            backgroundSound.setBuffer(buffer);
            backgroundSound.setLoop(true);
            backgroundSound.setVolume(0.5);
        }, undefined, (err) => {
            console.log('Audio-Ladehinweis: music.mp3 im Ordner prüfen.', err);
        });

        // 4. Beleuchtung
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
        scene.add(ambientLight);

        const frontLight = new THREE.DirectionalLight(0xffffff, 2.5);
        frontLight.position.set(5, 10, 7);
        scene.add(frontLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 1.5);
        backLight.position.set(-5, -5, -5);
        scene.add(backLight);

        // 5. Maus-Steuerung (OrbitControls)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Function to trigger the 3-second top text overlay
        function showModelTextOverlay() {
            const overlay = document.getElementById('model-text-overlay');
            const t = modelText[currentIndex];
            if (!t || t.trim() === "") {
                overlay.style.opacity = '0';
                overlay.style.display = 'none';
                return;
            }
            overlay.style.display = 'block';
            overlay.innerHTML = t;
            // Clear any existing timeout if a model loads quickly
            if (textTimeout) clearTimeout(textTimeout);

            // Show text
            overlay.style.opacity = '1';

            // Hide after 3 seconds
            textTimeout = setTimeout(() => {
                overlay.style.opacity = '0';
            }, 3000);
        }

        // 6. Funktion zum Laden des Modells
        const loader = new GLTFLoader();

        function loadModel(index) {
            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }

            const fileName = modelFiles[index];
            document.getElementById('model-name').innerText = fileName;

            // Trigger text display whenever a new model starts loading
            showModelTextOverlay();

            loader.load(fileName, (gltf) => {
                currentModel = gltf.scene;
                currentModel.updateMatrixWorld(true);
                scene.add(currentModel);

                const box = new THREE.Box3().setFromObject(currentModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());

                controls.target.copy(center);

                const maxDim = Math.max(size.x, size.y, size.z);
                if (maxDim > 0) {
                    const fov = camera.fov * (Math.PI / 180);
                    let cameraDistance = Math.abs(maxDim / 2 / Math.tan(fov / 2));
                    cameraDistance *= 1.8;

                    camera.position.set(center.x, center.y, center.z + cameraDistance);
                    camera.near = maxDim / 100;
                    camera.far = maxDim * 100;
                    camera.updateProjectionMatrix();
                }

                controls.update();
            }, undefined, (error) => {
                console.error('Fehler beim Laden von ' + fileName, error);
            });
        }

        // Shared function to switch to the next model and update background
        function nextModel() {
            currentIndex = (currentIndex + 1) % modelFiles.length;
            loadModel(currentIndex);
            if (currentIndex > 16) {
                scene.background = new THREE.Color().setHSL(Math.random(), 0.5, 0.75);
            } else {
                scene.background = new THREE.Color().setHSL(Math.random(), 0.5, 0.005);
            }
        }

        // 7. Button zum Durchschalten der Modelle & Hintergrundfarbwechsel (Manual override)
        document.getElementById('next-btn').addEventListener('click', () => {
            nextModel();
        });

        // Intro Overlay interaction to dismiss & start audio
        const introOverlay = document.getElementById('intro-overlay');
        introOverlay.addEventListener('pointerdown', () => {
            introOverlay.style.display = 'none';
            if (!audioStarted) {
                audioStarted = true;
                if (listener.context.state === 'suspended') {
                    listener.context.resume();
                }
                if (backgroundSound.buffer && !backgroundSound.isPlaying) {
                    backgroundSound.play();
                }
            }

            //// Fade out intro overlay
            //introOverlay.style.opacity = '0';
            //setTimeout(() => {
            //    introOverlay.style.display = 'none';
            //}, 800);
        });

        // Erstes Modell beim Start laden
        loadModel(currentIndex);
        camera.position.z = 5;

        // 9. Animations-Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Fenster-Größenänderung verarbeiten
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
